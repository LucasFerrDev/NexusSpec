[project]
name = "nexusspec"
version = "0.2.0"
description = "CLI para inicializar projetos com o workflow NexusSpec (SDD)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LucasFerrDev" }]
keywords = ["sdd", "spec-driven", "workflow", "cli", "copilot"]
dependencies = ["click>=8.0", "questionary>=2.0"]

[project.scripts]
nspec = "nexusspec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusspec"]

[dependency-groups]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
